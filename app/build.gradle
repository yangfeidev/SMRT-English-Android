plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

apply plugin: 'kotlin-parcelize'

android {
    namespace 'com.yangfei.smrtenglish'
    compileSdk 34

    defaultConfig {
        applicationId "com.yangfei.smrtenglish"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BASE_URL", '"https://smrtenglish.cn"'
        buildConfigField "String", "SCHOOL_KEY", '"sunshine"'
        buildConfigField "String", "HTTP_LOG", '"SmrtHttpLog"'
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "LOG_DEBUG", "true"
            debuggable true
            zipAlignEnabled true
        }
        release {
            buildConfigField "boolean", "LOG_DEBUG", "false"
            minifyEnabled false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "smrt_english_${variant.buildType.name}_v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.fragment
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.livedata

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // 图片加载（替代 iOS 的 Kingfisher）
    implementation "io.coil-kt:coil:2.5.0"

    // 网络（服务端渲染 HTML，非 JSON API，直接用 OkHttp 抓页面）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // json 解析 / 本地存储
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.tencent:mmkv:2.0.0'

    // RecyclerView 适配器
    implementation "io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.4"

    // 下拉刷新
    implementation 'io.github.scwang90:refresh-layout-kernel:2.1.0'
    implementation 'io.github.scwang90:refresh-header-classics:2.1.0'

    // 沉浸式状态栏
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    implementation 'com.geyifeng.immersionbar:immersionbar-ktx:3.2.2'

    // 工具类 https://github.com/Blankj/AndroidUtilCode
    implementation 'com.blankj:utilcodex:1.31.1'

    // Toast（兼容部分国产机关闭通知后无法显示 Toast）
    implementation 'com.github.getActivity:ToastUtils:10.3'

    // 事件总线（对齐 iOS NotificationCenter 的会话失效/恢复通知）
    implementation 'org.greenrobot:eventbus:3.1.1'

    // 视频播放（ExoPlayer 原生支持 AV1，替换 iOS 的 AVPlayer + WebView 兜底）
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
